{% extends "base.html" %}
{% block content %}
<div style="max-width: 400px; margin: 0 auto;">
    <h2>Регистрация</h2>
    <form id="register-form">
        <label>Email:</label><br>
        <input type="email" id="reg-email" name="email" required><br>
        <small id="email-feedback" style="display: block; margin-bottom: 10px;"></small>

        <label>Имя:</label><br>
        <input type="text" id="reg-name" name="name" required><br><br>

        <label>Пароль:</label><br>
        <input type="password" id="reg-password" name="password" required><br><br>

        <button type="submit" class="btn">Зарегистрироваться</button>
    </form>
    <!-- Место для вывода ошибок регистрации -->
    <p id="register-error" style="color: red; display: none;"></p>
</div>
{% endblock %}
