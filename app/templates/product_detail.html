{% extends "base.html" %}
{% block content %}
    <div style="margin-bottom: 20px;">
        <a href="/products" style="text-decoration: none; color: #555;">&larr; Назад к каталогу</a>
    </div>
    <div style="max-width: 600px; border: 1px solid #ddd; padding: 30px; border-radius: 8px;">
        <h1>{{ product.name }}</h1>
        <p>{{ product.description }}</p>
        <h2 style="color: #2c3e50;">Цена: {{ product.price }} руб.</h2>

        <button class="add-to-cart-btn" data-product-id="{{ product.id }}"
                style="padding: 12px 24px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; width: 100%;">
            🛒 Добавить в корзину
        </button>
    </div>
{% endblock %}
