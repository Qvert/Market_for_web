{% extends "base.html" %}

{% block content %}
    <div style="margin-bottom: 20px;">
        <a href="/" style="text-decoration: none; color: #555;">&larr; Назад к списку товаров</a>
    </div>

    <!-- Карточка детального просмотра -->
    <div style="max-width: 600px; border: 1px solid #ddd; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);">

        <h1 style="margin-top: 0;">{{ product.name }}</h1>

        <!-- Заглушка для фотографии -->
        <div style="width: 100%; height: 250px; background: #f4f4f4; display: flex; align-items: center; justify-content: center; color: #aaa; margin-bottom: 20px; font-size: 18px; border-radius: 4px;">
            [ Здесь может быть фото товара ]
        </div>

        <h3>Описание:</h3>
        <p style="font-size: 16px; line-height: 1.6; color: #444;">
            {{ product.description }}
        </p>

        <h2 style="color: #2c3e50; border-top: 1px solid #eee; padding-top: 20px;">
            Цена: {{ product.price }} руб.
        </h2>

        <!-- Кнопка добавления в корзину прямо со страницы товара -->
        <form action="/cart/add/{{ product.id }}" method="POST">
            <button type="submit" style="padding: 12px 24px; background: #28a745; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; width: 100%;">
                🛒 Добавить в корзину
            </button>
        </form>

    </div>
{% endblock %}
