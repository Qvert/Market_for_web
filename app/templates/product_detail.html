{% extends "base.html" %}

{% block content %}
    <div class="product-detail">
        <h1>{{ product.name }}</h1>
        <img src="/static/{{ product.image }}" alt="{{ product.name }}" style="max-width: 300px;">
        <p class="price">Цена: {{ product.price }} ₽</p>
        <p class="description">Описание товара... (тут можно добавить поле description в fake_products)</p>
        <a href="/products" class="btn">Назад в каталог</a>
    </div>
{% endblock %}
