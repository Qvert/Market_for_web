{% extends "base.html" %}

{% block content %}
    <h1>Каталог товаров</h1>
    <div class="products-grid">
        {% for product in products %}
            <div class="product-card">
                <h2>{{ product.name }}</h2>
                <p>Цена: {{ product.price }} ₽</p>
                <!-- Добавь кнопку "Подробнее" -->
            </div>
        {% endfor %}
    </div>
{% endblock %}
