{% extends "base.html" %}

{% block content %}
    <h1>Каталог товаров</h1>

    <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        {% for product in products %}
            <div style="border: 1px solid #ccc; padding: 20px; width: 250px; border-radius: 8px; text-align: center;">

                <!-- Название теперь тоже работает как ссылка на товар -->
                <h3 style="margin-top: 0;">
                    <a href="/product/{{ product.id }}" style="text-decoration: none; color: #333;">
                        {{ product.name }}
                    </a>
                </h3>

                <h2 style="color: #d9534f;">{{ product.price }} руб.</h2>

                <!-- Ссылка на подробную страницу -->
                <a href="/product/{{ product.id }}" style="display: block; margin-bottom: 15px; color: #007bff; text-decoration: none;">
                    Подробнее о товаре
                </a>

                <!-- Кнопка в мини-карточке товара (как просят в ТЗ) -->
                <form action="/cart/add/{{ product.id }}" method="POST">
                    <button type="submit" style="padding: 10px; background: #28a745; color: white; border: none; cursor: pointer; border-radius: 4px; width: 100%;">
                        Добавить в корзину
                    </button>
                </form>
            </div>
        {% endfor %}
    </div>
{% endblock %}
