{% extends "base.html" %}

{% block content %}
<style>
    /* ===== ПЕРЕМЕННЫЕ ===== */
    :root {
        --primary: #4f46e5;
        --primary-light: #eef2ff;
        --danger: #ef4444;
        --success: #10b981;
        --bg: #f8fafc;
        --white: #ffffff;
        --border: #e2e8f0;
        --text: #1e293b;
        --muted: #64748b;
        --radius: 10px;
    }

    /* Убираем паддинг у main на странице чата */
    main { padding: 0 !important; }

    /* ===== LAYOUT ЧАТА ===== */
    .chat-layout {
        display: flex;
        height: calc(100vh - 56px - 61px); /* Вычитаем высоту header и footer */
        overflow: hidden;
        background: var(--bg);
    }

    /* ===== ЛЕВАЯ ПАНЕЛЬ (Комнаты) ===== */
    .sidebar-left {
        width: 240px;
        background: var(--white);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }
    .panel-title {
        padding: 14px 16px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        border-bottom: 1px solid var(--border);
        background: var(--white);
    }
    .room-list { list-style: none; padding: 8px; flex: 1; overflow-y: auto; }
    .room-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 12px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: background 0.15s;
        margin-bottom: 2px;
    }
    .room-item:hover { background: var(--bg); }
    .room-item.active { background: var(--primary-light); color: var(--primary); font-weight: 600; }
    .room-name { flex: 1; font-size: 14px; }
    .room-meta { display: flex; align-items: center; gap: 6px; }
    .room-count { font-size: 11px; color: var(--muted); }
    .room-item.active .room-count { color: var(--primary); }
    .unread-badge {
        background: var(--danger);
        color: #fff;
        font-size: 10px;
        font-weight: 700;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 5px;
    }
    .unread-badge.visible { display: flex; }

    /* ===== ЦЕНТР (Чат) ===== */
    .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
    .chat-header {
        background: var(--white);
        border-bottom: 1px solid var(--border);
        padding: 0 20px;
        height: 52px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-shrink: 0;
    }
    .chat-header .room-label { font-weight: 600; font-size: 16px; }
    .chat-header .members-count { font-size: 13px; color: var(--muted); }

    /* Статус подключения */
    #status-badge {
        font-size: 12px;
        padding: 4px 10px;
        border-radius: 20px;
        background: #fef3c7;
        color: #92400e;
        transition: 0.3s;
    }
    #status-badge.connected { background: #d1fae5; color: #065f46; }
    #status-badge.error { background: #fee2e2; color: #991b1b; }

    /* ===== СООБЩЕНИЯ ===== */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        background: var(--bg);
    }
    .msg-system {
        align-self: center;
        font-size: 12px;
        color: var(--muted);
        background: var(--white);
        border: 1px solid var(--border);
        padding: 4px 14px;
        border-radius: 20px;
    }
    .msg-row { display: flex; gap: 10px; max-width: 72%; }
    .msg-row.mine { align-self: flex-end; flex-direction: row-reverse; }
    .msg-row.others { align-self: flex-start; }
    .msg-avatar {
        width: 34px; height: 34px;
        border-radius: 50%;
        background: var(--primary);
        color: #fff;
        display: flex; align-items: center; justify-content: center;
        font-size: 13px; font-weight: 600;
        flex-shrink: 0;
    }
    .msg-row.mine .msg-avatar { background: #6366f1; }
    .msg-content { display: flex; flex-direction: column; gap: 4px; }
    .msg-meta { font-size: 11px; color: var(--muted); display: flex; gap: 6px; }
    .msg-row.mine .msg-meta { justify-content: flex-end; }
    .msg-author { font-weight: 600; }
    .msg-bubble {
        padding: 10px 14px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.5;
        word-break: break-word;
    }
    .msg-row.others .msg-bubble {
        background: var(--white);
        border: 1px solid var(--border);
        border-top-left-radius: 4px;
        color: var(--text);
    }
    .msg-row.mine .msg-bubble {
        background: var(--primary);
        color: #fff;
        border-top-right-radius: 4px;
    }

    /* Индикатор набора */
    .typing-hint {
        background: var(--white);
        padding: 6px 20px;
        font-size: 12px;
        color: var(--primary);
        font-style: italic;
        min-height: 30px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
    }

    /* ===== ВВОД ===== */
    .chat-input-wrap {
        background: var(--white);
        border-top: 1px solid var(--border);
        padding: 12px 16px;
        display: flex;
        gap: 10px;
        align-items: flex-end;
        flex-shrink: 0;
    }
    #msg-input {
        flex: 1;
        resize: none;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 14px;
        font-size: 14px;
        outline: none;
        line-height: 1.4;
        max-height: 120px;
        font-family: inherit;
    }
    #msg-input:focus { border-color: var(--primary); }
    #msg-input:disabled { background: var(--bg); cursor: not-allowed; }
    #send-btn {
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: var(--radius);
        padding: 10px 20px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s;
        white-space: nowrap;
    }
    #send-btn:hover:not(:disabled) { background: #4338ca; }
    #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== ПРАВАЯ ПАНЕЛЬ (Участники) ===== */
    .sidebar-right {
        width: 210px;
        background: var(--white);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
    }
    .user-list { list-style: none; padding: 8px; flex: 1; overflow-y: auto; }
    .user-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: var(--radius);
        font-size: 13px;
    }
    .user-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; flex-shrink: 0; }
    .user-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-type { font-size: 10px; color: var(--muted); }
    .typing-users {
        padding: 8px 12px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--primary);
        font-style: italic;
        min-height: 40px;
    }

    /* ===== АДАПТИВ ===== */
    @media (max-width: 900px) { .sidebar-right { display: none; } }
    @media (max-width: 600px) {
        .sidebar-left { width: 56px; }
        .room-name, .room-count { display: none; }
    }
</style>

<!-- РАЗМЕТКА ЧАТА -->
<div class="chat-layout">

    <!-- Левая панель: Комнаты -->
    <div class="sidebar-left">
        <div class="panel-title">Комнаты</div>
        <ul class="room-list" id="room-list">
            <li class="room-item active" data-room="general">
                <span class="room-name">💬 Общий чат</span>
                <span class="room-meta">
                    <span class="room-count" id="count-general">0</span>
                    <span class="unread-badge" id="badge-general">0</span>
                </span>
            </li>
            <li class="room-item" data-room="support">
                <span class="room-name">🛠 Поддержка</span>
                <span class="room-meta">
                    <span class="room-count" id="count-support">0</span>
                    <span class="unread-badge" id="badge-support">0</span>
                </span>
            </li>
            <li class="room-item" data-room="products-discussion">
                <span class="room-name">🛍 Товары</span>
                <span class="room-meta">
                    <span class="room-count" id="count-products-discussion">0</span>
                    <span class="unread-badge" id="badge-products-discussion">0</span>
                </span>
            </li>
            <li class="room-item" data-room="random">
                <span class="room-name">🎲 Случайная</span>
                <span class="room-meta">
                    <span class="room-count" id="count-random">0</span>
                    <span class="unread-badge" id="badge-random">0</span>
                </span>
            </li>
        </ul>
    </div>

    <!-- Центральная область -->
    <div class="chat-main">
        <div class="chat-header">
            <div style="display: flex; flex-direction: column; gap: 2px;">
                <span class="room-label" id="header-room">💬 Общий чат</span>
                <span class="members-count" id="header-count">0 участников</span>
            </div>
            <span id="status-badge">Подключение...</span>
        </div>

        <div class="chat-messages" id="chat-messages"></div>

        <div class="typing-hint" id="typing-hint"></div>

        <div class="chat-input-wrap">
            <textarea id="msg-input" placeholder="Написать сообщение... (Enter — отправить, Shift+Enter — перенос)" rows="1" disabled></textarea>
            <button id="send-btn" disabled>Отправить</button>
        </div>
    </div>

    <!-- Правая панель: Участники -->
    <div class="sidebar-right">
        <div class="panel-title" id="right-panel-title">Участники (0)</div>
        <ul class="user-list" id="user-list"></ul>
        <div class="typing-users" id="typing-users"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<!-- Модуль WebSocket (отдельный файл — пункт 4 задания) -->
<script src="{{ url_for('static', path='/js/chat/websocket.js') }}"></script>

<script>
    // ====================================================
    // КОНФИГУРАЦИЯ
    // ====================================================
    const WS_URL = `ws://${location.host}/ws`;

    // Берём имя пользователя из сессии (Jinja2 передаёт его в шаблон)
    const SESSION_USER = "{{ request.session.get('user') or '' }}";
    const MY_TOKEN = SESSION_USER || null;

    // ====================================================
    // СОСТОЯНИЕ
    // ====================================================
    const state = {
        currentRoom: 'general',
        myName: SESSION_USER || null,
        unread: { general: 0, support: 0, 'products-discussion': 0, random: 0 },
        roomCounts: { general: 0, support: 0, 'products-discussion': 0, random: 0 },
        typingUsers: {},
        typingTimers: {},
    };

    const ROOM_LABELS = {
        'general':              '💬 Общий чат',
        'support':              '🛠 Поддержка',
        'products-discussion':  '🛍 Обсуждение товаров',
        'random':               '🎲 Случайная комната',
    };

    // ====================================================
    // ИНИЦИАЛИЗАЦИЯ КЛИЕНТА
    // ====================================================
    const client = new ChatClient(WS_URL, MY_TOKEN);

    // ====================================================
    // СИСТЕМНЫЕ СОБЫТИЯ
    // ====================================================
    client.on('system', (data) => {
        const badge = document.getElementById('status-badge');
        badge.textContent = data.message;
        badge.className = '';

        const input = document.getElementById('msg-input');
        const btn   = document.getElementById('send-btn');

        if (data.type === 'connected') {
            badge.classList.add('connected');
            input.disabled = false;
            btn.disabled   = false;
            client.send('join_room', { room: state.currentRoom });
        } else {
            if (data.type === 'error') badge.classList.add('error');
            input.disabled = true;
            btn.disabled   = true;
        }

        _appendSystem(data.message);
    });

    // ====================================================
    // СОБЫТИЯ ЧАТА
    // ====================================================

    client.on('room_history', ({ room, messages }) => {
        document.getElementById('chat-messages').innerHTML = '';
        messages.forEach(_renderMessage);
        _scrollToBottom();
    });

    client.on('message', (msg) => {
        _renderMessage(msg);
        _scrollToBottom();
    });

    client.on('typing_status', ({ userId, name, isTyping }) => {
        if (isTyping) {
            state.typingUsers[userId] = name;
            clearTimeout(state.typingTimers[userId]);
            state.typingTimers[userId] = setTimeout(() => {
                delete state.typingUsers[userId];
                _renderTyping();
            }, 3000);
        } else {
            clearTimeout(state.typingTimers[userId]);
            delete state.typingUsers[userId];
        }
        _renderTyping();
    });

    client.on('online_users', ({ room, users }) => {
        state.roomCounts[room] = users.length;
        _updateRoomCount(room);
        if (room === state.currentRoom) _renderUserList(users);
    });

    client.on('user_joined', ({ name, room }) => {
        if (room === state.currentRoom)
            _appendSystem(`${name} присоединился к комнате`);
    });

    client.on('user_left', ({ name, room }) => {
        if (room === state.currentRoom)
            _appendSystem(`${name} покинул комнату`);
    });

    client.on('error', ({ message }) => {
        _appendSystem(`⚠️ ${message}`);
    });

    // ====================================================
    // ДЕЙСТВИЯ ПОЛЬЗОВАТЕЛЯ
    // ====================================================

    // Переключение комнат
    document.getElementById('room-list').addEventListener('click', (e) => {
        const item = e.target.closest('.room-item');
        if (!item) return;
        const newRoom = item.dataset.room;
        if (newRoom === state.currentRoom) return;

        client.send('leave_room', { room: state.currentRoom });

        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');

        state.unread[newRoom] = 0;
        _updateBadge(newRoom);

        state.currentRoom = newRoom;
        document.getElementById('header-room').textContent = ROOM_LABELS[newRoom] || newRoom;
        document.getElementById('chat-messages').innerHTML = '';
        document.getElementById('user-list').innerHTML = '';
        document.getElementById('right-panel-title').textContent = 'Участники (0)';
        document.getElementById('header-count').textContent = '0 участников';
        state.typingUsers = {};
        _renderTyping();

        client.send('join_room', { room: newRoom });
    });

    // Отправка
    document.getElementById('send-btn').addEventListener('click', _sendMessage);

    document.getElementById('msg-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            _sendMessage();
        }
    });

    // Debounce индикатора печати
    let typingTimer;
    let isTypingSent = false;

    document.getElementById('msg-input').addEventListener('input', () => {
        if (!isTypingSent) {
            client.send('typing', { room: state.currentRoom, isTyping: true });
            isTypingSent = true;
        }
        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            client.send('typing', { room: state.currentRoom, isTyping: false });
            isTypingSent = false;
        }, 1500);
    });

    function _sendMessage() {
        const input = document.getElementById('msg-input');
        const text  = input.value.trim();
        if (!text) return;

        client.send('send_message', { room: state.currentRoom, text });
        input.value = '';
        input.style.height = 'auto';

        clearTimeout(typingTimer);
        if (isTypingSent) {
            client.send('typing', { room: state.currentRoom, isTyping: false });
            isTypingSent = false;
        }
    }

    // ====================================================
    // РЕНДЕР
    // ====================================================

    function _renderMessage(msg) {
        const container = document.getElementById('chat-messages');
        const isMine    = state.myName && msg.authorName === state.myName;
        const time      = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const initial   = (msg.authorName || '?')[0].toUpperCase();

        const div = document.createElement('div');
        div.className = `msg-row ${isMine ? 'mine' : 'others'}`;
        div.innerHTML = `
            <div class="msg-avatar">${initial}</div>
            <div class="msg-content">
                <div class="msg-meta">
                    <span class="msg-author">${isMine ? 'Вы' : _escape(msg.authorName)}</span>
                    <span>${time}</span>
                </div>
                <div class="msg-bubble">${_escape(msg.text)}</div>
            </div>
        `;
        container.appendChild(div);
    }

    function _appendSystem(text) {
        const container = document.getElementById('chat-messages');
        const div = document.createElement('div');
        div.className = 'msg-system';
        div.textContent = text;
        container.appendChild(div);
        _scrollToBottom();
    }

    function _renderUserList(users) {
        const list  = document.getElementById('user-list');
        const title = document.getElementById('right-panel-title');
        const count = document.getElementById('header-count');

        title.textContent = `Участники (${users.length})`;
        count.textContent = `${users.length} участников`;
        list.innerHTML    = '';

        users.forEach(u => {
            const li = document.createElement('li');
            li.className = 'user-item';
            li.innerHTML = `
                <span class="user-dot"></span>
                <span class="user-name">${_escape(u.name)}</span>
                <span class="user-type">${u.is_guest ? 'Гость' : '⭐'}</span>
            `;
            list.appendChild(li);
        });
    }

    function _renderTyping() {
        const names = Object.values(state.typingUsers);
        const text  = names.length === 0 ? '' :
                      names.length === 1 ? `${names[0]} печатает...` :
                      `${names.join(', ')} печатают...`;

        document.getElementById('typing-hint').textContent  = text;
        document.getElementById('typing-users').textContent = text;
    }

    function _updateBadge(room) {
        const badge = document.getElementById(`badge-${room}`);
        if (!badge) return;
        const count = state.unread[room] || 0;
        badge.textContent = count;
        badge.classList.toggle('visible', count > 0);
    }

    function _updateRoomCount(room) {
        const el = document.getElementById(`count-${room}`);
        if (el) el.textContent = state.roomCounts[room] || 0;
    }

    function _scrollToBottom() {
        const c = document.getElementById('chat-messages');
        c.scrollTop = c.scrollHeight;
    }

    function _escape(str) {
        return String(str || '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;')
            .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // ====================================================
    // СТАРТ
    // ====================================================
    client.connect();
</script>
{% endblock %}
