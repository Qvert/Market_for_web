<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат в реальном времени</title>
    <style>
        :root { --bg: #f3f4f6; --white: #ffffff; --primary: #3b82f6; --primary-hover: #2563eb; --text-main: #1f2937; --text-muted: #6b7280; --border: #e5e7eb; --me-bg: #dbeafe; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; padding: 20px; }

        /* Layout */
        .app-container { display: flex; width: 100%; max-width: 1200px; height: 90vh; background: var(--white); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }

        /* Левая панель (Комнаты) */
        .sidebar-left { width: 250px; background: #f8fafc; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .panel-header { padding: 15px 20px; border-bottom: 1px solid var(--border); font-weight: 600; color: var(--text-main); background: var(--white); }
        .room-list { list-style: none; padding: 10px; overflow-y: auto; }
        .room-item { padding: 12px 15px; border-radius: 8px; margin-bottom: 5px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--text-main); transition: 0.2s; }
        .room-item:hover { background: #e2e8f0; }
        .room-item.active { background: var(--primary); color: var(--white); }
        .unread-badge { background: #ef4444; color: white; font-size: 11px; padding: 2px 6px; border-radius: 10px; display: none; }
        .unread-badge.show { display: inline-block; }

        /* Центр (Чат) */
        .chat-center { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .system-status { font-size: 12px; padding: 4px 8px; border-radius: 4px; background: #fee2e2; color: #b91c1c; display: none; }
        .system-status.visible { display: block; }

        .chat-history { flex: 1; padding: 20px; overflow-y: auto; background: var(--white); display: flex; flex-direction: column; gap: 10px; }

        /* Сообщения */
        .msg-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .msg-others { align-self: flex-start; }
        .msg-mine { align-self: flex-end; }

        .msg-meta { font-size: 11px; color: var(--text-muted); margin-bottom: 4px; }
        .msg-mine .msg-meta { text-align: right; }

        .msg-bubble { padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .msg-others .msg-bubble { background: #f1f5f9; color: var(--text-main); border-bottom-left-radius: 2px; }
        .msg-mine .msg-bubble { background: var(--primary); color: var(--white); border-bottom-right-radius: 2px; }

        .system-msg { align-self: center; font-size: 12px; color: var(--text-muted); background: #f8fafc; padding: 4px 12px; border-radius: 12px; margin: 10px 0; }

        /* Ввод сообщения */
        .chat-input-area { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: var(--white); }
        .chat-input-area input { flex: 1; padding: 12px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
        .chat-input-area input:focus { border-color: var(--primary); }
        .chat-input-area button { padding: 10px 20px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
        .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Правая панель (Участники) */
        .sidebar-right { width: 220px; background: #f8fafc; border-left: 1px solid var(--border); display: flex; flex-direction: column; }
        .user-list { padding: 10px; overflow-y: auto; flex: 1; }
        .user-item { display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 13px; color: var(--text-main); }
        .status-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; }

        /* Индикатор печати */
        .typing-box { padding: 10px 15px; font-size: 12px; color: var(--primary); font-style: italic; min-height: 36px; border-top: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Левая панель: Комнаты -->
    <div class="sidebar-left">
        <div class="panel-header">Комнаты</div>
        <ul class="room-list">
            <li class="room-item active" data-room="general" onclick="switchRoom('general')">
                Общий чат <span class="unread-badge" id="badge-general">0</span>
            </li>
            <li class="room-item" data-room="support" onclick="switchRoom('support')">
                Поддержка <span class="unread-badge" id="badge-support">0</span>
            </li>
            <li class="room-item" data-room="products-discussion" onclick="switchRoom('products-discussion')">
                Товары <span class="unread-badge" id="badge-products-discussion">0</span>
            </li>
            <li class="room-item" data-room="random" onclick="switchRoom('random')">
                Случайная <span class="unread-badge" id="badge-random">0</span>
            </li>
        </ul>
    </div>

    <!-- Центр: Чат -->
    <div class="chat-center">
        <div class="chat-header">
            <h3 id="current-room-name">Общий чат</h3>
            <div id="system-status" class="system-status">Соединение...</div>
        </div>

        <div class="chat-history" id="chat-history">
            <!-- Сообщения -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="msg-input" placeholder="Написать сообщение..." disabled autocomplete="off">
            <button id="send-btn" onclick="sendUI_Message()" disabled>Отправить</button>
        </div>
    </div>

    <!-- Правая панель: Участники -->
    <div class="sidebar-right">
        <div class="panel-header" id="users-count">Онлайн: 0</div>
        <div class="user-list" id="user-list">
            <!-- Пользователи -->
        </div>
        <div class="typing-box" id="typing-indicator"></div>
    </div>
</div>

<!-- Подключаем наш выделенный модуль WebSocket -->
<script src="/static/js/chat/websocket.js"></script>

<script>
    // --- ИНИЦИАЛИЗАЦИЯ ---
    // Укажите URL бэкенда FastAPI (Обратите внимание на протокол ws://)
    const WS_URL = "ws://localhost:8000/ws";

    // Создаем экземпляр клиента из нашего модуля
    const chatClient = new ChatClient(WS_URL);

    let currentRoom = 'general';
    let myName = ""; // Для визуального отличия своих сообщений
    let unreadCounts = { 'general': 0, 'support': 0, 'products-discussion': 0, 'random': 0 };

    // Переменные для debounce печати
    let typingTimer;
    const TYPING_DELAY = 1000;

    // --- ПОДПИСКА НА СИСТЕМНЫЕ СОБЫТИЯ ---
    chatClient.on('system', (data) => {
        const statusEl = document.getElementById('system-status');

        if (data.type === 'connected') {
            statusEl.classList.remove('visible');
            document.getElementById('msg-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            // При успешном коннекте входим в комнату
            chatClient.send('join_room', { room: currentRoom });
        } else {
            statusEl.classList.add('visible');
            statusEl.innerText = data.message;
            statusEl.style.background = data.type === 'reconnecting' ? '#fef3c7' : '#fee2e2';
            statusEl.style.color = data.type === 'reconnecting' ? '#92400e' : '#b91c1c';

            document.getElementById('msg-input').disabled = true;
            document.getElementById('send-btn').disabled = true;
        }
    });

    // --- ПОДПИСКА НА СОБЫТИЯ ЧАТА ---

    // 1. Получение истории комнаты
    chatClient.on('room_history', (data) => {
        const historyEl = document.getElementById('chat-history');
        historyEl.innerHTML = ''; // Очистка при смене комнаты
        data.messages.forEach(msg => renderMessage(msg));
        chatClient.send("get_online_users", { room: currentRoom });
    });

    // 2. Новое сообщение
    chatClient.on('message', (msg) => {
        // Мы используем оптимистичный UI, поэтому свои сообщения (отрисованные сразу) игнорируем
        // Но если бэкенд шлет их нам, нужно проверять.
        // Для простоты мы будем отрисовывать всё, что шлет сервер.
        renderMessage(msg);

        // Определение имени (хак для отличия своих сообщений)
        if (!myName) myName = msg.authorName; // Сохраняем имя при первом ответе сервера
    });

    // 3. Кто-то печатает
    chatClient.on('typing_status', (data) => {
        const indicator = document.getElementById('typing-indicator');
        indicator.innerText = data.isTyping ? `${data.name} печатает...` : '';
    });

    // 4. Список юзеров и их входы/выходы
    chatClient.on('online_users', (data) => renderUserList(data.users));

    chatClient.on('user_joined', (data) => {
        renderSystemMessage(`${data.name} присоединился к комнате`);
        chatClient.send("get_online_users", { room: currentRoom });
    });

    chatClient.on('user_left', (data) => {
        renderSystemMessage(`${data.name} покинул комнату`);
        chatClient.send("get_online_users", { room: currentRoom });
    });


    // --- UI ФУНКЦИИ И ДЕЙСТВИЯ ПОЛЬЗОВАТЕЛЯ ---

    // Пункт 3.3: Переключение комнат
    function switchRoom(newRoom) {
        if (newRoom === currentRoom) return;

        // Отправляем лив из старой
        chatClient.send('leave_room', { room: currentRoom });

        // Меняем визуально
        document.querySelectorAll('.room-item').forEach(el => el.classList.remove('active'));
        document.querySelector(`.room-item[data-room="${newRoom}"]`).classList.add('active');
        document.getElementById('current-room-name').innerText = newRoom;

        // Сброс бейджа непрочитанных
        unreadCounts[newRoom] = 0;
        updateBadge(newRoom);

        currentRoom = newRoom;

        // Джоин в новую
        chatClient.send('join_room', { room: currentRoom });
    }

    // Пункт 3.4: Отправка сообщения
    function sendUI_Message() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        chatClient.send('send_message', { room: currentRoom, text: text });
        input.value = '';

        // Сброс индикатора печати сразу после отправки
        clearTimeout(typingTimer);
        chatClient.send('typing', { room: currentRoom, isTyping: false });
    }

    // Пункт 3.5: Debounce для печати текста
    document.getElementById('msg-input').addEventListener('input', () => {
        chatClient.send('typing', { room: currentRoom, isTyping: true });

        clearTimeout(typingTimer);
        typingTimer = setTimeout(() => {
            chatClient.send('typing', { room: currentRoom, isTyping: false });
        }, TYPING_DELAY);
    });

    // Отправка по Enter
    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendUI_Message();
    });

    // --- ФУНКЦИИ ОТРИСОВКИ (РЕНДЕРИНГ) ---

    function renderMessage(msg) {
        const historyEl = document.getElementById('chat-history');
        // Проверяем, наше это сообщение или чужое (для визуала)
        const isMine = (msg.authorName === myName);
        const time = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        const html = `
            <div class="msg-wrapper ${isMine ? 'msg-mine' : 'msg-others'}">
                <div class="msg-meta">${isMine ? 'Вы' : msg.authorName} • ${time}</div>
                <div class="msg-bubble">${msg.text}</div>
            </div>
        `;
        historyEl.insertAdjacentHTML('beforeend', html);

        // Автоскролл вниз
        historyEl.scrollTop = historyEl.scrollHeight;
    }

    function renderSystemMessage(text) {
        const historyEl = document.getElementById('chat-history');
        historyEl.insertAdjacentHTML('beforeend', `<div class="system-msg">${text}</div>`);
        historyEl.scrollTop = historyEl.scrollHeight;
    }

    function renderUserList(users) {
        document.getElementById('users-count').innerText = `Онлайн: ${users.length}`;
        const listEl = document.getElementById('user-list');
        listEl.innerHTML = '';

        users.forEach(user => {
            const icon = user.is_guest ? '👤' : '⭐';
            listEl.insertAdjacentHTML('beforeend', `
                <div class="user-item">
                    <div class="status-dot"></div>
                    ${icon} ${user.name}
                </div>
            `);
        });
    }

    function updateBadge(room) {
        const badge = document.getElementById(`badge-${room}`);
        if (unreadCounts[room] > 0) {
            badge.innerText = unreadCounts[room];
            badge.classList.add('show');
        } else {
            badge.classList.remove('show');
        }
    }

    // Запуск подключения
    chatClient.connect();

</script>
</body>
</html>
