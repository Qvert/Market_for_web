<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Мой Магазин</title>
    <!-- Подключаем CSS из папки static -->
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <style>
        body { font-family: Arial, sans-serif; }
        header { background: #333; color: white; padding: 15px; display: flex; justify-content: space-between; }
        header a { color: white; text-decoration: none; font-weight: bold; }
        .cart-icon { background: red; padding: 2px 8px; border-radius: 50%; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        {% if request.session.get("user") %}
    <span>Привет, {{ request.session.user.name }}!</span>
    <a href="/auth/logout">Выйти</a>
        {% else %}
            <a href="/auth/login">Войти</a>
            <a href="/auth/register">Регистрация</a>
        {% endif %}
        <nav>
            <a href="/" class="logo">MyStore</a>
            <ul>
                <li><a href="/">Главная</a></li>
                <li><a href="/products">Каталог</a></li>
            </ul>
        </nav>
        <a href="/">Главная</a>
        <!-- Счетчик корзины. Переменная cart_count передается во все шаблоны -->
        <a href="/cart">Корзина <span class="cart-icon">{{ cart_count }}</span></a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Мой Интернет-Магазин</p>
    </footer>

</body>
</html>
